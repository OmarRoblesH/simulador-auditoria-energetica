<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Auditoría Energética & ISO 50001</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Tesseract.js para OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { background-color: #1e293b; color: white; min-height: 100vh; }
        .sidebar .nav-link { color: #94a3b8; margin: 5px 0; border-radius: 6px; cursor: pointer; }
        .sidebar .nav-link.active, .sidebar .nav-link:hover { background-color: #334155; color: #fff; }
        .card { border: none; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .btn-primary { background-color: #2563eb; border: none; }
        .btn-primary:hover { background-color: #1d4ed8; }
        .step-section { display: none; }
        .step-section.active { display: block; }
        .ocr-dropzone { border: 2px dashed #cbd5e1; border-radius: 8px; padding: 25px; text-align: center; background: #f8fafc; cursor: pointer; }
        .ocr-dropzone:hover { background: #f1f5f9; border-color: #2563eb; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar de Navegación -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse p-3">
            <h5 class="text-white mb-4"><i class="fa-solid fa-bolt text-warning me-2"></i>Simulador ISO 50001</h5>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link active" data-step="0" onclick="showStep(0)"><i class="fa-solid fa-route me-2"></i>Inicio / Registro</a></li>
                <li class="nav-item"><a class="nav-link" data-step="1" onclick="showStep(1)"><i class="fa-solid fa-file-invoice-dollar me-2"></i>Datos & OCR Facturas</a></li>
                <li class="nav-item"><a class="nav-link" data-step="2" onclick="showStep(2)"><i class="fa-solid fa-sliders me-2"></i>Evaluación Técnica</a></li>
                <li class="nav-item"><a class="nav-link" data-step="3" onclick="showStep(3)"><i class="fa-solid fa-award me-2"></i>Auditoría ISO 50001</a></li>
                <li class="nav-item" id="nav-bloque4"><a class="nav-link" data-step="4" onclick="showStep(4)"><i class="fa-solid fa-boxes-stacked me-2"></i>Inventario de equipo</a></li>
                <li class="nav-item"><a class="nav-link" data-step="5" onclick="showStep(5)"><i class="fa-solid fa-chart-pie me-2"></i>Consumos & Dashboards</a></li>
            </ul>
        </nav
